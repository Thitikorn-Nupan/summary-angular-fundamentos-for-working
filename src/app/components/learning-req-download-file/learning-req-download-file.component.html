<div class="flex items-center">
  <p-checkbox (change)="listenTemplate()" value="template"  />
  <label class="ml-2"> {{titleTemplate}}</label>
</div>

<ng-container *ngIf="!switchTemplate">
  <ng-container *ngIf="pdfUrl !== '' && pdfUrl">
    <p-card header="PDF Document Viewer" >
      <iframe [src]="pdfUrl | previewPdf " width="100%" height="500px" style="border:none;" title="Embedded PDF Viewer"> </iframe >
    </p-card>
  </ng-container>
  <p-button label="Preview File AS PDF" severity="warn" (onClick)="previewPDF()">
    <ng-template pTemplate="icon">
      <i class="fa-solid fa-file-pdf"></i>
    </ng-template>
  </p-button>
  <p-button label="Download File AS PDF" severity="danger" (onClick)="downloadPDF()">
    <ng-template pTemplate="icon">
      <!-- Add your custom icon element here, e.g., Font Awesome or a Material icon -->
      <i class="fa-solid fa-file-pdf"></i>
    </ng-template>
  </p-button>
  <p-button label="Download File AS EXCEL" severity="success" (onClick)="downloadExcel()" >
    <ng-template pTemplate="icon">
      <i class="fa-solid fa-file-excel"></i>
    </ng-template>
  </p-button>
  <p-button label="Download File AS WORD" severity="info" (onClick)="downloadWord()" >
    <ng-template pTemplate="icon">
      <i class="fa-solid fa-file-word"></i>
    </ng-template>
  </p-button>
</ng-container>



<ng-container *ngIf="switchTemplate">
  <p-button label="Login And Get Token" severity="warn" (onClick)="login()"/>
  <ng-container *ngIf="token.length > 0">
    <ng-container *ngIf="pdfUrl !== '' && pdfUrl">
      <p-card header="PDF Document Viewer" >
        <iframe [src]="pdfUrl | previewPdf " width="100%" height="500px" style="border:none;" title="Embedded PDF Viewer"> </iframe >
      </p-card>
    </ng-container>
    <p-message severity="warn">{{token}}</p-message>
    <p-button label="Preview File AS PDF Auth " severity="warn" (onClick)="previewPDFAuthen()">
      <ng-template pTemplate="icon">
        <!-- Add your custom icon element here, e.g., Font Awesome or a Material icon -->
        <i class="fa-solid fa-file-pdf"></i>
      </ng-template>
    </p-button>
    <br/>
    <p-button label="Download File AS PDF Auth But Permission All" severity="danger" (onClick)="downloadPDFAuthButPermissionAll()">
      <ng-template pTemplate="icon">
        <!-- Add your custom icon element here, e.g., Font Awesome or a Material icon -->
        <i class="fa-solid fa-file-pdf"></i>
      </ng-template>
    </p-button>
    <br/>
    <p-button label="Download File AS PDF Auth " severity="danger" (onClick)="downloadPDFAuthen()">
      <ng-template pTemplate="icon">
        <!-- Add your custom icon element here, e.g., Font Awesome or a Material icon -->
        <i class="fa-solid fa-file-pdf"></i>
      </ng-template>
    </p-button>
    <p-button label="Download File AS EXCEL" severity="success" (onClick)="downloadExcelAuthen()" >
      <ng-template pTemplate="icon">
        <i class="fa-solid fa-file-excel"></i>
      </ng-template>
    </p-button>
    <p-button label="Download File AS WORD" severity="info" (onClick)="downloadWordAuthen()" >
      <ng-template pTemplate="icon">
        <i class="fa-solid fa-file-word"></i>
      </ng-template>
    </p-button>
  </ng-container>
</ng-container>
